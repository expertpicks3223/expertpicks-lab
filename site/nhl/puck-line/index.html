<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Puck Line Profile | ExpertPicks Lab</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#ffffff; --surface:#f5f6f8; --line:#e3e6eb; --text:#1c2633; --muted:#5d6878;
    --head:#1c2633; --head-text:#ffffff; --bar:#c9d1dc; --bar-fill:#1c2633; --avg:#d6452f;
    --friendly:#1d5fa8; --friendly-bg:#e3eefa; --neutral:#5d6878; --neutral-bg:#eceff3; --risky:#8a5a00; --risky-bg:#fbf0d9; --pos:#1f7a4d; --negc:#b3412e;
    --focus:#2f6fdb;
  }
  [data-theme="dark"]{
    --bg:#141c26; --surface:#1c2633; --line:#2c3847; --text:#eef1f5; --muted:#a3adbb;
    --head:#0e141b; --head-text:#eef1f5; --bar:#2c3847; --bar-fill:#e8edf3; --avg:#ff7a5c;
    --friendly:#8cc2ff; --friendly-bg:#1a2f4a; --neutral:#c3cbd6; --neutral-bg:#2a3542; --risky:#ffd27a; --risky-bg:#3d3018; --pos:#6fd6a0; --negc:#ff9a85;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{padding:12px}
  .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
  h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--bg);color:var(--text);border:0;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--head);color:var(--head-text);font-weight:600}
  input[type=search]{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;width:150px}
  button:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .league{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);font-variant-numeric:tabular-nums}
  .tablebox{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:var(--maxh,640px)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
  thead th{position:sticky;top:0;background:var(--head);color:var(--head-text);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:9px 10px;cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th .arr{opacity:.45;margin-left:3px}
  thead th[aria-sort="ascending"] .arr,thead th[aria-sort="descending"] .arr{opacity:1}
  tbody td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
  tbody tr:nth-child(even) td{background:var(--surface)}
  tbody td:first-child{text-align:left;font-weight:600}
  tbody td:nth-child(2){text-align:left}
  .abbr{color:var(--muted);font-weight:500;font-size:12px;margin-left:4px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
  .Wide{color:var(--friendly);background:var(--friendly-bg)}
  .Average{color:var(--neutral);background:var(--neutral-bg)}
  .Tight{color:var(--risky);background:var(--risky-bg)}
  .meter{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
  .bar{position:relative;width:70px;height:6px;background:var(--bar);border-radius:3px}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar-fill);border-radius:3px}
  .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--avg)}
  .small{color:var(--muted);font-size:11px}
  .pos{color:var(--pos)} .neg{color:var(--negc)}
  .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;color:var(--muted);font-size:11px;margin-top:8px}
  .foot a{color:inherit}
  .legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .legend .tick{display:inline-block;width:2px;height:10px;background:var(--avg);vertical-align:middle;margin-right:4px}
  .state{padding:28px;text-align:center;color:var(--muted)}
  .sh{display:none}
  .prices .bar{display:none} .prices th .lg{display:none} .prices th .sh{display:inline} .prices thead th,.prices tbody td{padding-left:7px;padding-right:7px}
  @media (max-width:560px){
    .wrap{padding:8px} input[type=search]{width:120px} .hide-sm{display:none}
    table{min-width:0} thead th,tbody td{padding:8px 6px} thead th{font-size:10px;letter-spacing:.02em}
    .nm{display:none} .lg{display:none} .sh{display:inline} .abbr{margin-left:0;color:var(--text);font-weight:700;font-size:13px}
    .prices .hp{display:none}
    .bar{display:none} .chip{font-size:11px;padding:5px 8px} .pill{font-size:10px;padding:2px 6px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>NHL Puck Line Profile</h1>
      <div class="sub" id="sub">When a team wins, how often is it by 2+ goals?</div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Season">
        <button type="button" data-season="current" aria-pressed="true" id="btnCur">This season</button>
        <button type="button" data-season="previous" aria-pressed="false" id="btnPrev">Last season</button>
      </div>
      <input type="search" id="q" placeholder="Find a team" aria-label="Find a team">
    </div>
  </div>
  <div class="league" id="league"></div>
  <div class="tablebox">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"><tr><td colspan="9" class="state">Loading the latest numbers…</td></tr></tbody>
    </table>
  </div>
  <div class="foot">
    <div class="legend"><span><span class="tick"></span>League average</span><span>* Fewer than 10 wins, small sample</span><span>Margin: Wide wins by 2+ often, Tight wins close. Blends this season with last</span><span id="plnote"></span></div>
    <div id="stamp"></div>
  </div>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark');
  if (params.get('height')) document.documentElement.style.setProperty('--maxh', parseInt(params.get('height'),10) + 'px');

  var COLS = [
    {k:'name', label:'Team', type:'text'},
    {k:'tier', label:'Margin', type:'tier', title:'Wide = wins by 2+ goals often. Tight = wins tend to be by one goal or in OT/SO. Blends this season with last season.'},
    {k:'wins', label:'Wins', type:'int'},
    {k:'win_by_2_pct', label:'Won by 2+', short:'By 2+', type:'meter', lg:'win_by_2_pct'},
    {k:'needed_eng_pct', label:'Needed ENG', short:'ENG', type:'pct', cls:'hp', title:'Share of 2+ goal wins that only reached 2 goals thanks to an empty-net goal'},
    {k:'otso_win_pct', label:'OT/SO wins', short:'OT/SO', type:'pct', cls:'hp', title:'Share of wins that came in overtime or a shootout (these never cover -1.5)'},
    {k:'cover_minus_15_pct', label:'-1.5 cover', short:'-1.5 %', type:'pct', cls:'hide-sm', title:'Won by 2+ goals, as a share of all games played'},
    {k:'cover_plus_15_pct', label:'+1.5 cover', short:'+1.5 %', type:'pct', cls:'hide-sm', title:'Won, or lost by exactly 1 goal, as a share of all games played'}
  ];
  var PRICE_COLS = [
    {k:'minus_units', label:'-1.5 P/L', short:'-1.5 P/L', type:'units', title:'Profit or loss betting this team -1.5 every game for 1 unit at DraftKings closing prices (2025-26)'},
    {k:'plus_units', label:'+1.5 P/L', short:'+1.5 P/L', type:'units', title:'Profit or loss betting this team +1.5 every game for 1 unit at DraftKings closing prices (2025-26)'}
  ];
  function cols(){ return state.season === 'previous' && state.data && state.data.previous_prices ? COLS.concat(PRICE_COLS) : COLS; }
  var TIER_ORDER = {Wide:3, Average:2, Tight:1};
  var state = {season:'current', sort:'tier', dir:-1, q:'', data:null};

  function pct(v){ return v == null ? '–' : (v*100).toFixed(1) + '%'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function rows(){
    var s = state.season;
    return state.data.teams.map(function(t){
      var p = t[s] || {};
      return {team:t.team, name:t.name, tier:t.tier, tier_score:t.tier_score, wins:p.wins, win_by_2_pct:p.win_by_2_pct,
        needed_eng_pct:p.needed_eng_pct, otso_win_pct:p.otso_win_pct, cover_minus_15_pct:p.cover_minus_15_pct, cover_plus_15_pct:p.cover_plus_15_pct,
        minus_units:t.previous_prices ? t.previous_prices.minus.units : null, plus_units:t.previous_prices ? t.previous_prices.plus.units : null};
    });
  }

  function renderHead(){
    var h = document.getElementById('head');
    h.innerHTML = cols().map(function(c){
      var sorted = state.sort === c.k ? (state.dir > 0 ? 'ascending' : 'descending') : 'none';
      var arr = state.sort === c.k ? (state.dir > 0 ? '▲' : '▼') : '↕';
      return '<th scope="col" tabindex="0" data-k="'+c.k+'" aria-sort="'+sorted+'" class="'+(c.cls||'')+'"'+(c.title?' title="'+esc(c.title)+'"':'')+'><span class="lg">'+c.label+'</span><span class="sh">'+(c.short||c.label)+'</span><span class="arr">'+arr+'</span></th>';
    }).join('');
    Array.prototype.forEach.call(h.children, function(th){
      var go = function(){ var k = th.getAttribute('data-k'); if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = (k === 'name') ? 1 : -1; } render(); };
      th.addEventListener('click', go);
      th.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  function render(){
    var lg = state.data.league[state.season];
    var label = state.season === 'current' ? state.data.current_season : state.data.previous_season;
    document.getElementById('league').innerHTML =
      '<span class="chip">'+label+' league: <b>'+pct(lg.win_by_2_pct)+'</b> of wins by 2+</span>'+
      '<span class="chip"><b>'+pct(lg.needed_eng_pct)+'</b> of those needed an empty-netter</span>'+
      '<span class="chip"><b>'+pct(lg.otso_win_pct)+'</b> of wins came in OT/SO</span>';
    var pn = document.getElementById('plnote');
    if (pn) pn.textContent = (state.season === 'previous' && state.data.previous_prices) ? 'P/L: 1 unit every game at DraftKings closing prices. Past results, not a prediction' : '';
    var r = rows().filter(function(x){ return !state.q || (x.name + ' ' + x.team).toLowerCase().indexOf(state.q) > -1; });
    r.sort(function(a,b){
      var k = state.sort, av = a[k], bv = b[k];
      if (k === 'tier') { av = a.tier_score; bv = b.tier_score; }
      if (k === 'name') return state.dir * String(av).localeCompare(String(bv));
      if (av == null) return 1; if (bv == null) return -1;
      return state.dir * (av - bv);
    });
    document.querySelector('table').classList.toggle('prices', cols().length > COLS.length);
    renderHead();
    var body = document.getElementById('body');
    if (!r.length) { body.innerHTML = '<tr><td colspan="9" class="state">No team matches that search.</td></tr>'; return post(); }
    body.innerHTML = r.map(function(x){
      return '<tr>' + cols().map(function(c){
        var v = x[c.k], cls = c.cls ? ' class="'+c.cls+'"' : '';
        if (c.type === 'text') return '<td'+cls+' title="'+esc(x.name)+'"><span class="nm">'+esc(x.name)+'</span><span class="abbr">'+esc(x.team)+'</span></td>';
        if (c.type === 'tier') return '<td'+cls+'><span class="pill '+x.tier+'">'+x.tier+'</span></td>';
        if (c.type === 'int') return '<td'+cls+'>'+(v == null ? '–' : v + (state.season === 'current' && v < 10 ? '<span class="small">*</span>' : ''))+'</td>';
        if (c.type === 'meter') {
          var w = v == null ? 0 : Math.max(0, Math.min(1, v)) * 100, a = (lg[c.lg] || 0) * 100;
          return '<td'+cls+'><span class="meter"><span>'+pct(v)+'</span><span class="bar" aria-hidden="true"><i style="width:'+w+'%"></i><u style="left:calc('+a+'% - 1px)"></u></span></span></td>';
        }
        if (c.type === 'units') return '<td'+cls+'><span class="'+(v == null ? '' : v >= 0 ? 'pos' : 'neg')+'">'+(v == null ? '–' : (v >= 0 ? '+' : '') + v.toFixed(1) + 'u')+'</span></td>';
        return '<td'+cls+'>'+pct(v)+'</td>';
      }).join('') + '</tr>';
    }).join('');
    post();
  }

  function post(){
    try { parent.postMessage({type:'ep-lab-height', id:'nhl-puck-line', height:document.documentElement.scrollHeight}, '*'); } catch(e){}
  }

  function setSeason(s){
    state.season = s;
    document.getElementById('btnCur').setAttribute('aria-pressed', s === 'current');
    document.getElementById('btnPrev').setAttribute('aria-pressed', s === 'previous');
    render();
  }
  document.getElementById('btnCur').addEventListener('click', function(){ setSeason('current'); });
  document.getElementById('btnPrev').addEventListener('click', function(){ setSeason('previous'); });
  document.getElementById('q').addEventListener('input', function(e){ state.q = e.target.value.trim().toLowerCase(); render(); });

  fetch('data.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    state.data = d;
    document.getElementById('btnCur').textContent = d.current_season;
    document.getElementById('btnPrev').textContent = d.previous_season;
    var dt = d.data_through ? new Date(d.data_through + 'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '–';
    document.getElementById('stamp').innerHTML = 'Games through ' + dt + ' · Updated daily · Source: NHL · ExpertPicks Lab';
    render();
  }).catch(function(){
    document.getElementById('body').innerHTML = '<tr><td colspan="9" class="state">The table couldn’t load right now. Please refresh the page.</td></tr>';
    post();
  });
  window.addEventListener('resize', post);
})();
</script>
</body>
</html>
